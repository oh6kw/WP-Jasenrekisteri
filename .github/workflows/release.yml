# Julkaisu: kun repositorioon viedään versiotagi (esim. v4.4.0), GitHub
#  1) rakentaa asennettavan jasenrekisteri.zip-tiedoston (kansion nimi aina "jasenrekisteri")
#  2) luo julkaisun (Release), jonka kuvaus otetaan CHANGELOG.md:n vastaavasta osiosta
# Jos julkaisu tehdään käsin GitHubin sivulla, zip liitetään siihen automaattisesti.
name: Julkaisu

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  julkaisu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP-syntaksin tarkistus
        run: |
          for f in $(find . -name '*.php' -not -path './.git/*'); do php -l "$f" > /dev/null || exit 1; done

      - name: Rakenna zip
        # git archive jättää pois .gitattributesin export-ignore-polut (docs, .github)
        run: |
          mkdir -p build
          git archive --format=tar --prefix=jasenrekisteri/ HEAD | tar -x -C build
          cd build && zip -qr ../jasenrekisteri.zip jasenrekisteri

      - name: Luo julkaisu tagista
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSIO="${TAG#v}"
          # Muutosloki: osio "## VERSIO ..." seuraavaan "## "-otsikkoon asti
          awk -v v="$VERSIO" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "**Asennus:** lataa alta \`jasenrekisteri.zip\` ja valitse WordPressissä *Lisäosat → Lisää uusi → Lataa lisäosa*. Aiempi versio korvataan, ja tiedot säilyvät."
          } >> notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" jasenrekisteri.zip --clobber
          else
            gh release create "$TAG" jasenrekisteri.zip --title "Jäsenrekisteri $VERSIO" --notes-file notes.md --verify-tag --latest
          fi

      - name: Liitä zip käsin tehtyyn julkaisuun
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" jasenrekisteri.zip --clobber

      - name: Tallenna zip (käsin ajettaessa)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: jasenrekisteri
          path: jasenrekisteri.zip

  wordpress-org:
    # Vienti WordPress.orgin lisäosahakemistoon. Toimii vasta, kun repositorion asetuksiin
    # (Settings → Secrets and variables → Actions) on lisätty SVN_USERNAME ja SVN_PASSWORD.
    needs: julkaisu
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: wordpress-org
    steps:
      - uses: actions/checkout@v4

      - name: Tarkista tunnukset ja versio
        id: check
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          VERSIO="${TAG#v}"
          echo "versio=$VERSIO" >> "$GITHUB_OUTPUT"
          if [ -z "$SVN_USERNAME" ]; then
            echo "SVN-tunnuksia ei ole asetettu – vienti WordPress.orgiin ohitetaan."
            echo "vie=false" >> "$GITHUB_OUTPUT"
          elif svn ls "https://plugins.svn.wordpress.org/jasenrekisteri/tags/$VERSIO" > /dev/null 2>&1; then
            echo "Versio $VERSIO on jo WordPress.orgissa – ohitetaan."
            echo "vie=false" >> "$GITHUB_OUTPUT"
          else
            echo "vie=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Vie WordPress.orgiin
        if: steps.check.outputs.vie == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: jasenrekisteri
          VERSION: ${{ steps.check.outputs.versio }}
          ASSETS_DIR: .wordpress-org
